server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: meal-order-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/meal_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
      # 非默认值，redis-cli CLIENT LIST 可见，用于证明配置被读到
      client-name: meal-order-backend
  servlet:
    multipart:
      # 商品图片上传限制；RustFS 单图 5MB 足够
      max-file-size: 5MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，M9 部署前关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 全库主键走雪花 ID，与 schema.sql 约定一致（见 docs/数据库设计.md 决策 1）
      id-type: assign_id
      # 逻辑删除统一字段：spu/sku/category 的 deleted
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    enabled: true

# JWT 双 token（开发期密钥直接写配置，M9 部署改 .env 注入）
jwt:
  secret: meal-order-dev-secret-key-please-change-in-prod-0123456789
  issuer: meal-order
  access-ttl-hours: 2
  refresh-ttl-days: 7

# 订单（M2）：支付截止时长分钟数，M5 延迟取消按 expire_time 执行；测试期可配小值
order:
  expire-minutes: 30

# RustFS（S3 兼容对象存储），容器见 docker/docker-compose.yml
rustfs:
  endpoint: http://localhost:9000
  access-key: mealadmin
  secret-key: mealadmin123
  bucket: meal-goods
  # 返回给前端的图片访问地址前缀（桶为 public-read）
  public-url: http://localhost:9000/meal-goods
