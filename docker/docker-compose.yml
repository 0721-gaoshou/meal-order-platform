name: meal-order

# 本地开发环境四件套（M0）
# 启动方式见同目录 README.md；数据全部落在 Docker 命名卷，down 不丢数据
# 注意：以下密码仅限本地开发，生产环境必须更换并走 .env 注入

services:

  mysql:
    image: mysql:8.0
    container_name: meal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: meal_root_2026
      MYSQL_DATABASE: meal_order
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro   # M1 放入 schema.sql 后，首次启动自动建表
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: meal-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    build: ./rabbitmq
    image: meal-rabbitmq:3.13-delayed
    container_name: meal-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # 管理控制台 guest/guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # M5 定制镜像：官方 3.13-management + rabbitmq_delayed_message_exchange（见 rabbitmq/Dockerfile）

  rustfs:
    image: rustfs/rustfs
    container_name: meal-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"      # S3 API；控制台暂不启用（当前版本开启后主进程约 16s 优雅退出，上游 bug，见进度书决策）
    environment:
      RUSTFS_ACCESS_KEY: mealadmin
      RUSTFS_SECRET_KEY: mealadmin123
    volumes:
      - rustfs-data:/data

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  rustfs-data:
